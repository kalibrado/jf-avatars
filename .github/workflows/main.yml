name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag (ex: v2.4.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Determine Tag Name
        id: tag_step
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v$TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV

      - name: Install node modules
        run: npm ci

      - name: Update version in package.json
        run: |
          npm version ${{ steps.tag_step.outputs.tag }} --allow-same-version --no-git-tag-version

      - name: Commit package.json version update
        id: commit_version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.tag_step.outputs.tag }} [skip ci]"
          VERSION_COMMIT_SHA=$(git rev-parse HEAD)
          echo "version_commit=$VERSION_COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Create/Update tag
        run: |
          # Supprimer le tag s'il existe déjà localement
          git tag -d ${{ steps.tag_step.outputs.tag }} 2>/dev/null || true
          # Créer le tag sur le nouveau commit
          git tag -a ${{ steps.tag_step.outputs.tag }} -m "Release ${{ steps.tag_step.outputs.tag }}"
          git push origin ${{ steps.tag_step.outputs.tag }} --force
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Build the project
        run: npm run build

      - name: Generate documentation
        run: npm run docs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.tag }}
          generate_release_notes: true
          files: ./dist/main.js

      - name: Upload documentation to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs/jf-avatars/${{ steps.tag_step.outputs.tag }}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4