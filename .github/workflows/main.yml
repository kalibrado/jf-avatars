name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag (ex: 2.4.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Determine Tag Name
        id: tag_step
        run: |
          TAG_RAW="${{ github.event.inputs.tag_name }}"
          
          # Pour GIT TAG et RELEASE : Ajoute 'v' si absent
          TAG_GIT="$TAG_RAW"
          if [[ ! "$TAG_GIT" =~ ^v ]]; then
            TAG_GIT="v$TAG_GIT"
          fi
          
          # Pour JSDOC / DOCS : Utilise le tag RAW (sans v, car jsdoc ne l'ajoute pas)
          TAG_DOCS="$TAG_RAW"
          
          echo "tag_git=$TAG_GIT" >> $GITHUB_OUTPUT
          echo "tag_docs=$TAG_DOCS" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_GIT" >> $GITHUB_ENV

      - name: Install node modules
        run: npm ci

      - name: Check package.json BEFORE version update
        id: check_before
        run: |
          echo "=== Version AVANT mise à jour ==="
          PREV_VERSION=$(node -p "require('./package.json').version")
          echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "$PREV_VERSION"

      - name: Update version in package.json
        run: |
          VERSION=${{ steps.tag_step.outputs.tag_git }}
          echo "Tentative de mise à jour vers : $VERSION"
          npm version $VERSION --allow-same-version --no-git-tag-version || exit 1

      - name: Check package.json AFTER version update
        id: check_after
        run: |
          echo "=== Version APRÈS mise à jour ==="
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "$NEW_VERSION"

          if [ "$PREV_VERSION" != "$NEW_VERSION" ]; then
            echo "change_detected=true" >> $GITHUB_OUTPUT
            echo "Version a été modifiée avec succès !"
          else
            echo "change_detected=false" >> $GITHUB_OUTPUT
            echo "::warning:: La version n'a pas changé, peut-être déjà à $NEW_VERSION"
          fi

      - name: Commit package.json version update
        if: steps.check_after.outputs.change_detected == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.tag_step.outputs.tag_git }} [skip ci]"
          VERSION_COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$VERSION_COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Create/Update tag on correct commit
        if: steps.check_after.outputs.change_detected == 'true'
        run: |
          git tag -d ${{ steps.tag_step.outputs.tag_git }} 2>/dev/null || true
          git tag -a ${{ steps.tag_step.outputs.tag_git }} -m "Release ${{ steps.tag_step.outputs.tag_git }}"
          git push origin ${{ steps.tag_step.outputs.tag_git }} --force
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Build the project
        run: npm run build

      - name: Generate documentation
        run: npm run docs

      - name: Upload documentation to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # ✅ CORRIGÉ : On utilise tag_docs (sans 'v') au lieu de tag_git
          path: "./docs/jf-avatars/${{ steps.tag_step.outputs.tag_docs }}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # ✅ Le tag de release porte bien le 'v' pour GitHub
          tag_name: ${{ steps.tag_step.outputs.tag_git }}
          generate_release_notes: true
          files: ./dist/main.js
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
